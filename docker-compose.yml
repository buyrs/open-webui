services:
  open-webui:
    build: .
    ports:
      - "3000:8080"
    volumes:
      - open-webui-data:/app/backend/data
    environment:
      # General
      - WEBUI_URL=https://chat.boutikio.com
      - WEBUI_NAME=Boutikio
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY}

      # CORS — restrict to known origins in production
      - CORS_ALLOW_ORIGIN=https://chat.boutikio.com;https://web.boutikio.com

      # Database (MariaDB on Plesk host)
      - DATABASE_URL=${DATABASE_URL}

      # OAuth Configuration
      - ENABLE_OAUTH_SIGNUP=true
      - ENABLE_LOGIN_FORM=false
      - OAUTH_MERGE_ACCOUNTS_BY_EMAIL=true
      - ENABLE_OAUTH_TOKEN_EXCHANGE=true
      - OAUTH_CLIENT_ID=${OAUTH_CLIENT_ID}
      - OAUTH_CLIENT_SECRET=${OAUTH_CLIENT_SECRET}
      - OAUTH_PROVIDER_NAME=${OAUTH_PROVIDER_NAME}
      - OAUTH_SCOPES=${OAUTH_SCOPES}
      - OPENID_REDIRECT_URI=${OPENID_REDIRECT_URI}
      - OAUTH_AUTHORIZE_URL=${OAUTH_AUTHORIZE_URL}
      - OAUTH_TOKEN_URL=${OAUTH_TOKEN_URL}
      - OAUTH_USERINFO_URL=${OAUTH_USERINFO_URL}

      # LLM Configuration (Alibaba Cloud DashScope)
      - OPENAI_API_BASE_URL=https://dashscope-intl.aliyuncs.com/compatible-mode/v1
      - OPENAI_API_KEY=${DASHSCOPE_API_KEY}
      - DEFAULT_MODELS=qwen3.5-plus

      # Feature Flags
      - SHOW_ADMIN_DETAILS=false
      - ENABLE_COMMUNITY_SHARING=false
      - ENABLE_MESSAGE_RATING=false

      # Disable features not needed for partners
      - ENABLE_NOTES=false
      - ENABLE_CHANNELS=false
      - ENABLE_FOLDERS=false

      # Disable workspace access for non-admin users (partners)
      - USER_PERMISSIONS_WORKSPACE_MODELS_ACCESS=false
      - USER_PERMISSIONS_WORKSPACE_KNOWLEDGE_ACCESS=false
      - USER_PERMISSIONS_WORKSPACE_PROMPTS_ACCESS=false
      - USER_PERMISSIONS_WORKSPACE_TOOLS_ACCESS=false
      - USER_PERMISSIONS_WORKSPACE_SKILLS_ACCESS=false
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  open-webui-data:
